name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly link-rot sweep (Monday 06:00 UTC)
    - cron: '0 6 * * 1'

jobs:
  table-lint:
    name: Table shape and ordering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_readme.py

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept '200..=206,403,429'
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
